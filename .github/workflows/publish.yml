name: Publish candidate

# Publishes a built candidate as a GitHub pre-release and points the update feed at it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate tag that was built
        required: true
        type: string
      run_id:
        description: Run ID of the "Candidate artifacts" build (omit for a locally staged site)
        required: false
        type: string
      site_sha256:
        description: SHA-256 of site.tar.gz on the verified local release (omit with run_id)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Validate publication inputs
        env:
          RUN_ID: ${{ inputs.run_id }}
          SITE_SHA256: ${{ inputs.site_sha256 }}
        run: |
          node -e 'const {RUN_ID:r,SITE_SHA256:s}=process.env; if (!((/^[1-9][0-9]*$/.test(r) && !s) || (!r && /^[a-f0-9]{64}$/.test(s)))) process.exit(1)'
      - name: Download the locally verified site
        if: inputs.site_sha256 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.tag }}
          SITE_SHA256: ${{ inputs.site_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/publish/site"
          gh release download "$CANDIDATE_TAG" -R "$GITHUB_REPOSITORY" -p site.tar.gz -D "$RUNNER_TEMP/publish"
          printf '%s  %s/site.tar.gz\n' "$SITE_SHA256" "$RUNNER_TEMP/publish" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/publish/site.tar.gz" -C "$RUNNER_TEMP/publish/site"
          node --input-type=module -e 'import {readFile,readdir} from "node:fs/promises"; import {PLATFORMS} from "./scripts/release/matrix.mjs"; const p=process.env.RUNNER_TEMP+"/publish/site"; const files=(await readdir(p)).sort(); if(JSON.stringify(files)!==JSON.stringify(["index.html","latest.json"])) throw Error("unexpected_site_files"); const feed=JSON.parse(await readFile(p+"/latest.json","utf8")); if(feed.version!==process.env.CANDIDATE_TAG.slice(1) || JSON.stringify(Object.keys(feed.platforms).sort())!==JSON.stringify(Object.values(PLATFORMS).map(x=>"axial-"+x.updater).sort())) throw Error("site_release_mismatch");'
      - name: Download the candidate build
        if: inputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/downloads" -p 'candidate-assets-*'
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/downloads/candidate-source" -n candidate-source
          mkdir "$RUNNER_TEMP/assets"
          for platform in linux-amd64 windows-amd64 macos-amd64 macos-arm64; do
            mv "$RUNNER_TEMP/downloads/candidate-assets-$platform" "$RUNNER_TEMP/assets/$platform"
          done
      - name: Verify signatures and stage the release
        if: inputs.run_id != ''
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\nDomains=~.\n' | sudo tee /etc/systemd/resolved.conf.d/public-dns.conf > /dev/null
          sudo systemctl restart systemd-resolved
          sudo apt-get update > /dev/null && sudo apt-get install -y minisign > /dev/null
          node -e 'const s=require(process.argv[1]); if (s.tag !== process.env.CANDIDATE_TAG || s.source_sha !== process.argv[2]) process.exit(1)' "$RUNNER_TEMP/downloads/candidate-source/source.json" "$(git rev-parse HEAD)"
          node scripts/release/publish.mjs --source "$RUNNER_TEMP/downloads/candidate-source/source.json" --assets "$RUNNER_TEMP/assets" --public-key apps/desktop/updater.pub --changelog CHANGELOG.md --guide apps/desktop/platform/install-guide.html --output "$RUNNER_TEMP/publish"
      - name: Create the pre-release
        if: inputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          version="${CANDIDATE_TAG#v}"
          gh release create "$CANDIDATE_TAG" -R "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "Axial $version" --notes-file "$RUNNER_TEMP/publish/notes.md" "$RUNNER_TEMP"/publish/release/*
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/publish/site

  feed:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}latest.json
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
