name: Rewrite verification

on:
  pull_request:
  push:
    branches: [main, feat/clean-rewrite]

permissions:
  contents: read

concurrency:
  group: rewrite-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.0
      - name: Test release rejection and evidence behavior
        shell: bash
        run: |
          status=0
          node --test scripts/release/*.test.mjs acceptance/native/*.test.mjs > "$RUNNER_TEMP/delivery-tests.log" 2>&1 || status=$?
          tail -n 70 "$RUNNER_TEMP/delivery-tests.log"
          exit "$status"
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.0
      - name: Prepare pinned tools and native keyring build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
          rustup toolchain install 1.93.1 --profile minimal
          npm install --global pnpm@11.28.10
          pnpm --dir frontend install --frozen-lockfile --ignore-scripts
      - name: Check semantic and asset policies
        shell: bash
        run: |
          status=0
          pnpm --dir frontend run lint:semantic > "$RUNNER_TEMP/source-policies.log" 2>&1 && node scripts/verify-assets.mjs >> "$RUNNER_TEMP/source-policies.log" 2>&1 || status=$?
          tail -n 70 "$RUNNER_TEMP/source-policies.log"
          exit "$status"
      - name: Check dependency policy with the pinned auditor
        shell: bash
        run: |
          status=0
          cargo install cargo-deny --version '=0.20.2' --locked > "$RUNNER_TEMP/dependencies.log" 2>&1 && test "$(cargo deny --version)" = 'cargo-deny 0.20.2' && node scripts/dependency-policy.mjs check >> "$RUNNER_TEMP/dependencies.log" 2>&1 || status=$?
          tail -n 70 "$RUNNER_TEMP/dependencies.log"
          exit "$status"
      - name: Build retained interface
        shell: bash
        run: |
          status=0
          pnpm --dir frontend run build > "$RUNNER_TEMP/frontend-build.log" 2>&1 && node frontend/verify-generation.mjs >> "$RUNNER_TEMP/frontend-build.log" 2>&1 || status=$?
          tail -n 70 "$RUNNER_TEMP/frontend-build.log"
          exit "$status"
      - name: Verify generated public wire types
        shell: bash
        run: |
          status=0
          node scripts/cargo-target.mjs run -- cargo run -p axial-app --example export_contracts -- --check > "$RUNNER_TEMP/wire-contracts.log" 2>&1 || status=$?
          tail -n 70 "$RUNNER_TEMP/wire-contracts.log"
          exit "$status"
      - name: Test launcher core and local API
        shell: bash
        env:
          RUST_TEST_NOCAPTURE: 1
          RUST_BACKTRACE: 1
        run: |
          status=0
          node scripts/cargo-target.mjs run -- cargo test -p axial-app -p axial-api -p axial-fs -p axial-minecraft -p axial-performance -p axial-resource --lib > "$RUNNER_TEMP/application-tests.log" 2>&1 || status=$?
          tail -n 70 "$RUNNER_TEMP/application-tests.log"
          if [ "$status" -ne 0 ]; then
            echo "--- test panics ---"
            grep -A 6 "^thread '.*panicked at" "$RUNNER_TEMP/application-tests.log" | cut -c 1-2000 | head -n 200 || true
          fi
          exit "$status"
      - name: Preserve failed core test output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-test-failure
          path: ${{ runner.temp }}/application-tests.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Typecheck and test retained interface
        shell: bash
        run: |
          status=0
          node frontend/test/run.mjs > "$RUNNER_TEMP/frontend-tests.log" 2>&1 || status=$?
          tail -n 70 "$RUNNER_TEMP/frontend-tests.log"
          exit "$status"
