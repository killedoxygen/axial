name: Rewrite candidate artifacts

# This workflow has no publisher, signing secrets, or installed-user mutations.
# A separately authorized release supplies trust material and real native evidence.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing candidate tag whose version and changelog match
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rewrite-candidate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.1
      - name: Enforce dependency and asset policies before candidate admission
        shell: bash
        run: |
          status=0
          npm install --global pnpm@11.1.3 > "$RUNNER_TEMP/source-policies.log" 2>&1 && pnpm --dir frontend install --frozen-lockfile --ignore-scripts >> "$RUNNER_TEMP/source-policies.log" 2>&1 && cargo install cargo-deny --version '=0.20.2' --locked >> "$RUNNER_TEMP/source-policies.log" 2>&1 && test "$(cargo deny --version)" = 'cargo-deny 0.20.2' && node scripts/dependency-policy.mjs check >> "$RUNNER_TEMP/source-policies.log" 2>&1 && node scripts/verify-assets.mjs >> "$RUNNER_TEMP/source-policies.log" 2>&1 || status=$?
          tail -n 70 "$RUNNER_TEMP/source-policies.log"
          exit "$status"
      - name: Verify exact source, version, identity, and changelog
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          source_sha=$(git rev-parse HEAD)
          node scripts/release/contract.mjs verify-source --tag "$CANDIDATE_TAG" --sha "$source_sha" --metadata "$RUNNER_TEMP/metadata.json" --output "$RUNNER_TEMP/source.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rewrite-source
          path: ${{ runner.temp }}/source.json
          if-no-files-found: error

  package:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
            target: x86_64-unknown-linux-gnu
            overlay: linux
            binary: axial-desktop
          - runner: windows-2025
            platform: windows-amd64
            target: x86_64-pc-windows-msvc
            overlay: windows
            binary: axial-desktop.exe
          - runner: macos-15-intel
            platform: macos-amd64
            target: x86_64-apple-darwin
            overlay: macos
            binary: axial-desktop
          - runner: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
            overlay: macos
            binary: axial-desktop
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rewrite-source
          path: ${{ runner.temp }}/rewrite-source
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}
      - name: Install Linux package prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Build embedded frontend
        shell: bash
        run: |
          status=0
          pnpm --dir frontend install --frozen-lockfile --ignore-scripts > "$RUNNER_TEMP/frontend.log" 2>&1 && pnpm --dir frontend run build >> "$RUNNER_TEMP/frontend.log" 2>&1 && node frontend/verify-generation.mjs >> "$RUNNER_TEMP/frontend.log" 2>&1 || status=$?
          tail -n 70 "$RUNNER_TEMP/frontend.log"
          exit "$status"
      - name: Install pinned bundler
        shell: bash
        run: |
          status=0
          cargo install tauri-cli --version '=2.12.0' --locked > "$RUNNER_TEMP/bundler.log" 2>&1 || status=$?
          tail -n 50 "$RUNNER_TEMP/bundler.log"
          exit "$status"
      - name: Build native candidate packages
        working-directory: apps/desktop
        shell: bash
        env:
          CANDIDATE_TARGET: ${{ matrix.target }}
          CANDIDATE_OVERLAY: ${{ matrix.overlay }}
        run: |
          status=0
          cargo tauri build --target "$CANDIDATE_TARGET" --config "platform/tauri.$CANDIDATE_OVERLAY.json" --config '{"build":{"beforeBuildCommand":""}}' -- --locked > "$RUNNER_TEMP/package.log" 2>&1 || status=$?
          tail -n 80 "$RUNNER_TEMP/package.log"
          exit "$status"
      - name: Collect complete package handoff
        shell: bash
        env:
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
          CANDIDATE_TARGET: ${{ matrix.target }}
          CANDIDATE_BINARY: ${{ matrix.binary }}
        run: |
          node scripts/release/package.mjs --platform "$CANDIDATE_PLATFORM" --source "$RUNNER_TEMP/rewrite-source/source.json" --binary "target/$CANDIDATE_TARGET/release/$CANDIDATE_BINARY" --bundle-root "target/$CANDIDATE_TARGET/release/bundle" --output "$RUNNER_TEMP/handoff"
          node scripts/release/contract.mjs verify-artifacts --source "$RUNNER_TEMP/rewrite-source/source.json" --assets "$RUNNER_TEMP/handoff" --platform "$CANDIDATE_PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rewrite-assets-${{ matrix.platform }}
          path: ${{ runner.temp }}/handoff
          if-no-files-found: error
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rewrite-build-logs-${{ matrix.platform }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

  readiness:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rewrite-assets-*
          path: ${{ runner.temp }}/downloads
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rewrite-source
          path: ${{ runner.temp }}/rewrite-source
      - name: Evaluate release readiness
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/assets"
          for platform in linux-amd64 windows-amd64 macos-amd64 macos-arm64; do
            mv "$RUNNER_TEMP/downloads/rewrite-assets-$platform" "$RUNNER_TEMP/assets/$platform"
          done
          node acceptance/native/verify.mjs --source "$RUNNER_TEMP/rewrite-source/source.json" --assets "$RUNNER_TEMP/assets" --evidence acceptance/native/evidence > "$RUNNER_TEMP/readiness.json"
      - name: Retain explicit readiness gaps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rewrite-readiness
          path: ${{ runner.temp }}/readiness.json
          if-no-files-found: error
