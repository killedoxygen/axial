name: Repair update feed

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Stage the existing site with corrected platform identifiers
        run: |
          mkdir site
          curl --fail --silent --show-error https://updates.axial.run/ -o site/index.html
          curl --fail --silent --show-error https://updates.axial.run/latest.json -o site/latest.json
          echo '11ca9c1ffb8b0fbe8141c96c90c4065e3a2fdc0288349fb2031ebbbbdc3ce465  site/latest.json' | sha256sum --check
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          const file = 'site/latest.json';
          const feed = JSON.parse(await readFile(file, 'utf8'));
          const targets = ['linux-x86_64', 'windows-x86_64', 'darwin-x86_64', 'darwin-aarch64'];
          if (feed.version !== '0.4.0-rc.5' || Object.keys(feed.platforms).length !== targets.length) {
            throw new Error('Unexpected published release');
          }
          const platforms = {};
          for (const target of targets) {
            const entry = feed.platforms[`axial-rewrite-${target}`];
            if (!entry?.signature || !entry.url.startsWith('https://github.com/killedoxygen/axial/releases/download/v0.4.0-rc.5/')) {
              throw new Error('Unexpected published platform');
            }
            platforms[`axial-${target}`] = entry;
          }
          await writeFile(file, JSON.stringify({ ...feed, platforms }, null, 2) + '\n');
          JS
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: repair
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}latest.json
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
