[package]
name = "axial-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["embedded-frontend"]
embedded-frontend = ["dep:include_dir", "dep:mime_guess"]

[dependencies]
axial-app.workspace = true
axial-fs.workspace = true
axial-minecraft.workspace = true
axum.workspace = true
async-stream.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
url.workspace = true
dirs.workspace = true
thiserror.workspace = true
include_dir = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }

[build-dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
axial-app = { workspace = true, features = ["test-support"] }
axial-minecraft = { workspace = true, features = ["test-support"] }
axial-performance.workspace = true
axial-resource.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
tempfile.workspace = true
reqwest.workspace = true
http-body-util.workspace = true
png.workspace = true
sha1.workspace = true
sha2.workspace = true
zip.workspace = true
