[workspace]
members = [
  "apps/api",
  "apps/desktop",
  "core/app",
  "core/fs",
  "core/minecraft",
  "core/performance",
  "core/resource",
]
exclude = ["legacy"]
resolver = "3"

[workspace.package]
version = "0.4.0-dev.5"
edition = "2024"
license = "MIT"
authors = ["Mateoltd"]

[workspace.dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.6", features = ["macros"] }
base64 = "0.22.1"
chrono = { version = "0.4.44", default-features = true, features = ["clock", "serde"] }
dirs = "=6.0.0"
ed25519-dalek = "2.2.0"
flate2 = "1.1.5"
futures-util = "0.3.32"
include_dir = "0.7.4"
http-body-util = "0.1.3"
im = "15.1.0"
libc = "0.2.184"
lzma-rs = "0.3.0"
md5 = "0.8.0"
mime_guess = "2.0.5"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
png = "0.17.16"
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "http2", "gzip", "brotli", "deflate", "stream", "multipart"] }
regex = "1.12.2"
self-replace = "1.5.0"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
sha1 = "0.10.6"
sha2 = "0.10.9"
shlex = "1.3.0"
sysinfo = "0.37.2"
tempfile = "3.27.0"
tar = "0.4.44"
tauri = { version = "=2.11.2" }
tauri-build = { version = "=2.6.2" }
tauri-plugin-dialog = "2.4.2"
tauri-plugin-opener = "2.5.0"
tauri-plugin-updater = "~2.12.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
unicode-casefold = "=0.2.0"
unicode-normalization = "=0.1.25"
url = "2.5.7"
uuid = { version = "1.23.0", features = ["v4", "serde"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
hex = "0.4.3"
axial-fs = { path = "core/fs" }
axial-resource = { path = "core/resource" }
axial-minecraft = { path = "core/minecraft" }
axial-app = { path = "core/app" }
axial-performance = { path = "core/performance" }
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
ts-rs = { version = "12.0.1", features = ["serde-compat", "uuid-impl"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }

# Managed publication repeats cryptographic admission proofs; keep dev SHA-1 throughput usable.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.sha1]
opt-level = 3

[profile.dev-full]
inherits = "dev"
debug = "full"
