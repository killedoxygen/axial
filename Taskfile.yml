version: '3'

tasks:
  check:
    desc: Check the replacement workspace and retained interface
    cmds:
      - task: frontend:lint:semantic
      - task: assets:check
      - task: contracts:check
      - task: frontend:build
      - task: frontend:test
      - node scripts/cargo-target.mjs run -- cargo check --workspace --all-targets
  test:
    desc: Test the replacement Rust workspace
    cmds:
      - task: frontend:build
      - node scripts/cargo-target.mjs run -- cargo test --workspace
  test:app:
    desc: Test feature-owned application behavior
    cmds:
      - node scripts/cargo-target.mjs run -- cargo test -p axial-app
  test:api:
    desc: Test authenticated loopback API and feature adapters
    cmds:
      - task: frontend:build
      - node scripts/cargo-target.mjs run -- cargo test -p axial-api
  test:desktop:
    desc: Test native shell ownership and command behavior on this host
    cmds:
      - task: frontend:build
      - node scripts/cargo-target.mjs run -- cargo test -p axial-desktop
  test:delivery:
    desc: Test artifact and installed-evidence rejection rules
    cmds:
      - node --test scripts/release/*.test.mjs acceptance/native/*.test.mjs
  fmt:
    cmds:
      - cargo fmt --all
  fmt:check:
    cmds:
      - cargo fmt --all --check
  frontend:build:
    cmds:
      - pnpm --dir frontend run build
      - node frontend/verify-generation.mjs
  frontend:lint:semantic:
    desc: Reject invalid hooks and unhandled promises in the retained interface
    cmds:
      - pnpm --dir frontend run lint:semantic
  assets:check:
    desc: Verify source assets against their retained rights and provenance records
    cmds:
      - node scripts/verify-assets.mjs
  dependencies:check:
    desc: Enforce the Cargo and pnpm advisory, license, and registry policies
    preconditions:
      - sh: test "$(cargo deny --version)" = 'cargo-deny 0.20.2'
        msg: Install cargo-deny 0.20.2 with its locked dependencies before checking policy.
    cmds:
      - node scripts/dependency-policy.mjs check
  frontend:test:
    cmds:
      - node frontend/test/run.mjs
  contracts:generate:
    desc: Generate reviewed public Rust wire types for the frontend
    cmds:
      - node scripts/cargo-target.mjs run -- cargo run -p axial-app --example export_contracts
  contracts:check:
    desc: Reject stale or unexpected generated public wire types
    cmds:
      - node scripts/cargo-target.mjs run -- cargo run -p axial-app --example export_contracts -- --check
  dev:api:
    desc: Run the replacement API with its independent development profile
    cmds:
      - task: frontend:build
      - node scripts/cargo-target.mjs run -- cargo run -p axial-api
  dev:desktop:
    desc: Run the replacement desktop with the development interface and independent profile
    env:
      PORT: '1420'
    cmds:
      - task: frontend:build
      - >-
        node scripts/cargo-target.mjs run -- cargo tauri dev --config
        '{"build":{"beforeDevCommand":{"script":"pnpm run dev:desktop","cwd":"{{toSlash .ROOT_DIR}}/frontend"},"devUrl":"http://127.0.0.1:1420"}}'
        -- --locked
  dev:legacy:
    desc: Run the preserved application from its independent project root
    dir: legacy
    cmds:
      - task dev
