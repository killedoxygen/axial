[package]
name = "axial-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-support = ["axial-minecraft/test-support", "axial-performance/test-support"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
reqwest.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
url.workspace = true
tracing.workspace = true

axial-fs.workspace = true
axial-resource.workspace = true
axial-minecraft.workspace = true
axial-performance.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
chrono.workspace = true
flate2.workspace = true
futures-util.workspace = true
lzma-rs.workspace = true
md5.workspace = true
regex.workspace = true
png.workspace = true
p256.workspace = true
rand.workspace = true
shlex.workspace = true
sysinfo.workspace = true
unicode-casefold.workspace = true
unicode-normalization.workspace = true
zip.workspace = true
rusqlite.workspace = true
ts-rs.workspace = true
keyring.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
ntapi = "0.4.3"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
axial-minecraft = { workspace = true, features = ["test-support"] }
